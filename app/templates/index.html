<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bag Counter</title>

    <style>
        body {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;

            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        h1 {
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            padding: 8px;
        }

        button {
            padding: 9px 16px;
            border: 1px solid #333;
            border-radius: 6px;

            background: #222;
            color: white;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: 600;
        }

        #result {
            margin-top: 24px;
            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;

            margin-bottom: 20px;
        }

        .result-item {
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .result-item span {
            display: block;
            margin-bottom: 5px;

            color: #666;
            font-size: 13px;
        }

        .result-item strong {
            font-size: 22px;
        }

        #download-link {
            display: inline-block;

            color: #1558d6;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .results {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <h1>Bag Counter</h1>

    <div class="controls">
        <input
            id="video-input"
            type="file"
            accept="video/*"
        >

        <button id="process-button">
            Process video
        </button>
    </div>

    <p id="status"></p>

    <div id="result" hidden>
        <div class="results">
            <div class="result-item">
                <span>Total bags</span>
                <strong id="total-bags"></strong>
            </div>

            <div class="result-item">
                <span>Forward</span>
                <strong id="forward"></strong>
            </div>

            <div class="result-item">
                <span>Backward</span>
                <strong id="backward"></strong>
            </div>

            <div class="result-item">
                <span>Anomalies</span>
                <strong id="anomalies"></strong>
            </div>
        </div>

        <a
            id="download-link"
            href="#"
        >
            Download processed video
        </a>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
